services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  supplier-finder:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8787
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      HEADLESS: "true"
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-50}
      MAX_CONCURRENT_PER_DOMAIN: ${MAX_CONCURRENT_PER_DOMAIN:-3}
      MIN_INTERVAL_MS: ${MIN_INTERVAL_MS:-1000}
      SUPPLIER_TIMEOUT_MS: ${SUPPLIER_TIMEOUT_MS:-12000}
      PROXY_URL: ${PROXY_URL:-}
    volumes:
      - hf-models:/app/models
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  redis-data:
  hf-models:
